<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memoli CMS</title>

  <!-- Decap CMS CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/decap-cms@3.14.0/dist/decap-cms.css"
  />

  <!-- Base styles for iframe container -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      overflow: hidden;
      background: #f5f5f5;
    }

    #cms-root {
      width: 100%;
      height: 100%;
    }

    .cms-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #ffffff;
      flex-direction: column;
      font-size: 16px;
      color: #666;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .cms-error {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #fff3cd;
      flex-direction: column;
      font-size: 16px;
      color: #856404;
      gap: 15px;
      padding: 20px;
      text-align: center;
    }

    .error-message {
      max-width: 400px;
      line-height: 1.5;
    }

    .error-code {
      font-family: "Courier New", monospace;
      background: rgba(0, 0, 0, 0.1);
      padding: 10px 15px;
      border-radius: 4px;
      margin-top: 10px;
      word-break: break-all;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- CMS root element -->
  <div id="cms-root" class="cms-loading">
    <div class="spinner"></div>
    <div>Loading Decap CMS...</div>
  </div>

  <!-- Decap CMS UMD build -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.14.0/dist/decap-cms.umd.js"></script>

  <!-- CMS initialization script -->
  <script>
    /**
     * Decap CMS Standalone Initialization
     *
     * This script:
     * 1. Fetches the CMS configuration from the Next.js API endpoint
     * 2. Waits for the CMS library to load
     * 3. Initializes CMS with the fetched config
     * 4. Handles errors gracefully
     *
     * Why this works:
     * - No React hydration (pure HTML/JS)
     * - No Next.js providers or styles applied
     * - Isolated from the parent page's DOM
     * - Decap CMS renders directly into #cms-root
     */

    (async function initializeCMS() {
      const cmsRoot = document.getElementById("cms-root");
      const maxRetries = 50; // ~10 seconds at 200ms intervals
      let retryCount = 0;

      try {
        // Step 1: Fetch CMS configuration from API
        console.log("[CMS] Fetching configuration from /api/cms-config...");
        const configResponse = await fetch("/api/cms-config");

        if (!configResponse.ok) {
          throw new Error(
            `Failed to fetch CMS config: ${configResponse.status} ${configResponse.statusText}`
          );
        }

        const cmsConfig = await configResponse.json();
        console.log("[CMS] Configuration loaded:", cmsConfig);

        // Step 2: Wait for CMS library to load
        // The UMD script loads async, so we poll for availability
        while (!window.CMS && retryCount < maxRetries) {
          await new Promise((resolve) => setTimeout(resolve, 200));
          retryCount++;
        }

        if (!window.CMS) {
          throw new Error(
            "CMS library failed to load after 10 seconds. Check CDN connectivity."
          );
        }

        console.log("[CMS] Decap CMS library loaded");

        // Step 3: Initialize CMS with config
        console.log("[CMS] Initializing with config...");
        window.CMS.init({ config: cmsConfig });

        // Clear loading state - CMS will render into #cms-root
        console.log("[CMS] ✓ Initialization complete");

        // Log backend info for debugging
        const backend = cmsConfig.backend;
        const env =
          backend.name === "test-repo" ? "DEVELOPMENT" : "PRODUCTION";
        console.log(`[CMS] Environment: ${env}`);
        console.log(`[CMS] Backend: ${backend.name}`);
        if (backend.branch) {
          console.log(`[CMS] Branch: ${backend.branch}`);
        }
        console.log(`[CMS] Media folder: ${cmsConfig.media_folder}`);
      } catch (error) {
        console.error("[CMS] Initialization failed:", error);

        // Show error message to user
        const errorMsg = error instanceof Error ? error.message : String(error);
        cmsRoot.innerHTML = `
          <div class="cms-error">
            <div style="font-weight: bold; margin-bottom: 10px;">⚠️ CMS Load Failed</div>
            <div class="error-message">${escapeHtml(errorMsg)}</div>
            <div class="error-code">
              Try refreshing the page or check browser console for details.
            </div>
          </div>
        `;
      }
    })();

    /**
     * Escape HTML to prevent XSS in error messages
     */
    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
