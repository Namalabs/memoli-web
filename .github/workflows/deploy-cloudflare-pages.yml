# Deploy Next.js static export to Cloudflare Pages
# Runs when you push a tag matching memoli-v* (e.g. memoli-v1.0).
#
# 3 Required Secrets (Cloudflare) + 3 Required Variables (client-side) + 1 Optional Variable (server-side)
#   Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT_NAME
#   Variables: NEXT_PUBLIC_TURNSTILE_SITE_KEY, NEXT_PUBLIC_N8N_BETA_WEBHOOK_URL, NEXT_PUBLIC_BETA_SIGNUP_API_KEY
#   Optional Variable: TURNSTILE_SECRET_KEY (for captcha verification)

name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - "memoli-v*"
  workflow_dispatch: # Allow manual run from Actions tab

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_N8N_BETA_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_N8N_BETA_WEBHOOK_URL }}
      NEXT_PUBLIC_BETA_SIGNUP_API_KEY: ${{ vars.NEXT_PUBLIC_BETA_SIGNUP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate configuration
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}" ] && missing="$missing CLOUDFLARE_PAGES_PROJECT_NAME"
          [ -z "${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" ] && missing="$missing NEXT_PUBLIC_TURNSTILE_SITE_KEY"
          [ -z "${{ vars.NEXT_PUBLIC_N8N_BETA_WEBHOOK_URL }}" ] && missing="$missing NEXT_PUBLIC_N8N_BETA_WEBHOOK_URL"
          [ -z "${{ vars.NEXT_PUBLIC_BETA_SIGNUP_API_KEY }}" ] && missing="$missing NEXT_PUBLIC_BETA_SIGNUP_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required config:$missing"
            echo "Secrets → CLOUDFLARE_* | Variables → NEXT_PUBLIC_* (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "All required secrets and variables are set"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
